openapi: 3.0.3
info:
  title: Dizi-izi API
  version: 0.1.0
  description: Документация для проекта Dizi-izi-backend
  contact:
    email: dizi.izi.plan@gmail.com
  license:
    name: MIT License
paths:
  /api/v1/auth/token/login/:
    post:
      operationId: auth_token_login_create
      description: Принимает учетные данные пользователя и возвращает токен аутентификации,
        если данные верны.
      summary: Аутентификация пользователя
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenCreate'
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
          description: ''
        '400':
          description: 'Error: Bad Request'
        '500':
          description: 'Server error'
  /api/v1/auth/token/logout/:
    post:
      operationId: auth_token_logout_create
      description: Удаляет токен аутентификации пользователя из системы, осуществляя
        выход.
      summary: Выход пользователя
      tags:
      - auth
      security:
      - tokenAuth: []
      responses:
        '204':
          description: 'No response body'
        '401':
          description: 'Error: Unauthorized'
        '500':
          description: 'Server error'
  /api/v1/social_auth/convert-token/:
    post:
      operationId: social_auth_convert_token_create
      description: 'Implements an endpoint to convert a provider token to an access
        token


        The endpoint is used in the following flows:


        * Authorization code

        * Client credentials'
      tags:
      - social_auth
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          description: No response body
        '500':
          description: 'Server error'
  /api/v1/social_auth/disconnect-backend/:
    post:
      operationId: social_auth_disconnect_backend_create
      description: An endpoint for disconnect social auth backend providers such as
        Facebook.
      tags:
      - social_auth
      security:
      - tokenAuth: []
      responses:
        '200':
          description: No response body
        '500':
          description: 'Server error'
  /api/v1/social_auth/invalidate-refresh-tokens/:
    post:
      operationId: social_auth_invalidate_refresh_tokens_create
      description: Invalidate all refresh tokens associated with a client id.
      tags:
      - social_auth
      security:
      - tokenAuth: []
      responses:
        '200':
          description: No response body
        '500':
          description: 'Server error'
  /api/v1/social_auth/invalidate-sessions/:
    post:
      operationId: social_auth_invalidate_sessions_create
      description: Delete all access tokens associated with a client id.
      tags:
      - social_auth
      security:
      - tokenAuth: []
      responses:
        '200':
          description: No response body
        '500':
          description: 'Server error'
  /api/v1/social_auth/revoke-token/:
    post:
      operationId: social_auth_revoke_token_create
      description: Implements an endpoint to revoke access or refresh tokens
      tags:
      - social_auth
      security:
      - tokenAuth: []
      responses:
        '200':
          description: No response body
        '500':
          description: 'Server error'
  /api/v1/social_auth/token/:
    post:
      operationId: social_auth_token_create
      description: 'Implements an endpoint to provide access tokens


        The endpoint is used in the following flows:


        * Authorization code

        * Password

        * Client credentials'
      tags:
      - social_auth
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          description: No response body
        '500':
          description: 'Server error'
  /api/v1/tariffs/:
    get:
      operationId: tariffs_list
      description: 'Список тарифов.


        Просмотр доступен для всех. Редактирование только для суперпользователя.'
      tags:
      - tariffs
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tariff'
          description: ''
        '500':
          description: 'Server error'
    post:
      operationId: tariffs_create
      description: 'Список тарифов.


        Просмотр доступен для всех. Редактирование только для суперпользователя.'
      tags:
      - tariffs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tariff'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Tariff'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Tariff'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tariff'
          description: ''
        '500':
          description: 'Server error'
  /api/v1/tariffs/{name_english}/:
    patch:
      operationId: tariffs_partial_update
      description: Добавляем тариф пользователю.
      parameters:
      - in: path
        name: name_english
        schema:
          type: string
        required: true
      tags:
      - tariffs
      security:
      - tokenAuth: []
      responses:
        '200':
          description: No response body
        '500':
          description: 'Server error'
  /api/v1/users/:
    get:
      operationId: users_list
      description: Возвращает данные пользователя. Для администратора возвращает список
        всех пользователей
      summary: Получение данных пользователя
      tags:
      - users
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
          description: Данные пользователя
        '401':
          description: 'Error: Unauthorized'
        '500':
          description: 'Server error'
    post:
      operationId: users_create
      description: Создает нового пользователя с предоставленными данными.
      summary: Создание нового пользователя
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreatePasswordRetype'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserCreatePasswordRetype'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserCreatePasswordRetype'
        required: true
      security:
      - tokenAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: Данные созданного пользователя
        '400':
          description: 'Error: Bad Request'
        '500':
          description: 'Server error'
  /api/v1/users/{id}/:
    get:
      operationId: users_retrieve
      description: Возвращает информацию о пользователе по его уникальному идентификатору.
        Требуются права администратора или собственные данные пользователя.
      summary: Получение информации о пользователе
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this user.
        required: true
      tags:
      - users
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: Данные пользователя
        '401':
          description: 'Error: Unauthorized'
        '500':
          description: 'Server error'
    put:
      operationId: users_update
      description: Обновляет информацию о пользователе с использованием полного набора
        данных. Требуются права администратора или собственные данные пользователя.
      summary: Обновление информации пользователя
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this user.
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomUser'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: Данные пользователя
        '401':
          description: 'Error: Unauthorized'
        '400':
          description: 'Error: Bad Request'
        '500':
          description: 'Server error'
    patch:
      operationId: users_partial_update
      description: Обновляет информацию о пользователе, используя только предоставленные
        поля. Требуются права администратора или собственные данные пользователя.
      summary: Частичное обновление информации пользователя
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this user.
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCustomUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCustomUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCustomUser'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: Данные пользователя
        '401':
          description: 'Error: Unauthorized'
        '400':
          description: 'Error: Bad Request'
        '500':
          description: 'Server error'
    delete:
      operationId: users_destroy
      description: Удаляет пользователя. Требуется права администратора.
      summary: Удаление пользователя
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this user.
        required: true
      tags:
      - users
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
        '401':
          description: 'Error: Unauthorized'
        '403':
          description: 'Error: Forbidden'
        '500':
          description: 'Server error'
  /api/v1/users/activation/:
    post:
      operationId: users_activation_create
      description: Активирует пользователя после регистрации. Требуется отправка кода
        активации, полученного пользователем.
      summary: Активация пользователя
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Activation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Activation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Activation'
        required: true
      security:
      - tokenAuth: []
      - {}
      responses:
        '204':
          description: No response body
        '403':
          description: 'Error: Forbidden'
        '400':
          description: 'Error: Bad Request'
        '500':
          description: 'Server error'
  /api/v1/users/me/:
    get:
      operationId: users_me_retrieve
      description: Возвращает информацию о текущем пользователе.
      summary: Получение информации о текущем пользователе
      tags:
      - users
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: Данные пользователя
        '401':
          description: 'Error: Unauthorized'
        '500':
          description: 'Server error'
    put:
      operationId: users_me_update
      description: Позволяет полностью обновить информацию о текущем пользователе.
      summary: Обновление информации текущего пользователя
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomUser'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: Данные пользователя
        '401':
          description: 'Error: Unauthorized'
        '400':
          description: 'Error: Bad Request'
        '500':
          description: 'Server error'
    patch:
      operationId: users_me_partial_update
      description: Позволяет частично обновить информацию о текущем пользователе.
      summary: Частичное обновление информации текущего пользователя
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCustomUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCustomUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCustomUser'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: Данные пользователя
        '401':
          description: 'Error: Unauthorized'
        '400':
          description: 'Error: Bad Request'
        '500':
          description: 'Server error'
    delete:
      operationId: users_me_destroy
      description: Удаляет текущего пользователя. Требуется права администратора.
      summary: Удаление текущего пользователя
      tags:
      - users
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
        '401':
          description: 'Error: Unauthorized'
        '403':
          description: 'Error: Forbidden'
        '500':
          description: 'Server error'
  /api/v1/users/resend_activation/:
    post:
      operationId: users_resend_activation_create
      description: Повторно отправляет письмо активации пользователю, который не активировал
        свой аккаунт.
      summary: Повторная отправка письма активации
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendEmailReset'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SendEmailReset'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendEmailReset'
        required: true
      security:
      - tokenAuth: []
      - {}
      responses:
        '204':
          description: No response body
        '400':
          description: 'Error: Bad Request'
        '500':
          description: 'Server error'
  /api/v1/users/reset_email/:
    post:
      operationId: users_reset_email_create
      description: Инициирует процесс сброса адреса почты пользователя, отправляя
        инструкции на электронную почту пользователя. Требуется предоставление электронной
        почты, ассоциированной с аккаунтом.
      summary: Сброс адреса почты пользователя
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendEmailReset'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SendEmailReset'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendEmailReset'
        required: true
      security:
      - tokenAuth: []
      - {}
      responses:
        '204':
          description: No response body
        '400':
          description: 'Error: Bad Request'
        '500':
          description: 'Server error'
  /api/v1/users/reset_email_confirm/:
    post:
      operationId: users_reset_email_confirm_create
      description: Позволяет пользователю подтвердить сброс и установить новый адрес
        почты пользователя, используя код подтверждения, отправленный на его электронную
        почту. Этот процесс завершает смену адреса почты пользователя.
      summary: Подтверждение сброса адреса почты пользователя
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsernameResetConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UsernameResetConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UsernameResetConfirm'
        required: true
      security:
      - tokenAuth: []
      - {}
      responses:
        '204':
          description: No response body
        '400':
          description: 'Error: Bad Request'
        '500':
          description: 'Server error'
  /api/v1/users/reset_password/:
    post:
      operationId: users_reset_password_create
      description: Инициирует процесс сброса пароля, отправляя письмо для сброса на
        электронную почту пользователя.
      summary: Сброс пароля
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendEmailReset'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SendEmailReset'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendEmailReset'
        required: true
      security:
      - tokenAuth: []
      - {}
      responses:
        '204':
          description: No response body
        '400':
          description: 'Error: Bad Request'
        '500':
          description: 'Server error'
  /api/v1/users/reset_password_confirm/:
    post:
      operationId: users_reset_password_confirm_create
      description: Завершает процесс сброса пароля, устанавливая новый пароль для
        пользователя.
      summary: Подтверждение сброса пароля
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
        required: true
      security:
      - tokenAuth: []
      - {}
      responses:
        '204':
          description: No response body
        '400':
          description: 'Error: Bad Request'
        '500':
          description: 'Server error'
  /api/v1/users/set_email/:
    post:
      operationId: users_set_email_create
      description: Позволяет текущему пользователю изменить свой адрес почты на новый.
      summary: Установка нового адреса почты пользователя
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetUsername'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SetUsername'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SetUsername'
        required: true
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
        '400':
          description: 'Error: Bad Request'
        '401':
          description: 'Error: Unauthorized'
        '500':
          description: 'Server error'
  /api/v1/users/set_password/:
    post:
      operationId: users_set_password_create
      description: Позволяет пользователю установить новый пароль.
      summary: Установка нового пароля
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SetPassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SetPassword'
        required: true
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
        '400':
          description: 'Error: Bad Request'
        '401':
          description: 'Error: Unauthorized'
        '500':
          description: 'Server error'
  /api/v1/furniture/:
    get:
      operationId: furniture_list
      description: Возвращает список всех предметов мебели
      summary: Список всех предметов мебели
      parameters:
      - in: query
        name: type_of_rooms
        schema:
          type: string
      tags:
      - furniture
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Furniture'
          description: Данные мебели
        '401':
          description: Unauthorized
        '500':
          description: 'Server error'
  /api/v1/furniture/{id}/:
    get:
      operationId: furniture_retrieve
      description: Возвращает данные мебели по её уникальному идентификатору.
      summary: Описание отдельного предмета мебели
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - furniture
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Furniture'
          description: Данные мебели
        '401':
          description: Unauthorized
        '404':
          description: Furniture item not found
        '500':
          description: 'Server error'
  /api/v1/projects/:
    get:
      tags:
      - projects
      summary: List all projects
      description: Returns a list of all projects
      security:
      - tokenAuth: []
      responses:
        '200':
          description: A list of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          description: Unauthorized
        '500':
          description: 'Server error'
    post:
      tags:
      - projects
      summary: Create a new project as a draft
      description: Creates a new project as a draft
      security:
      - tokenAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required:
              - name
      responses:
        '201':
          description: Project created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '500':
          description: 'Server error'
  /api/v1/projects/{project_id}/:
    get:
      tags:
      - projects
      summary: Get project by id
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      security:
      - tokenAuth: []
      responses:
        '200':
          description: Project and associated layouts
          content:
            application/json:
              schema:
                type: object
