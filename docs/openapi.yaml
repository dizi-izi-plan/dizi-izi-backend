  /api/v1/projects/{project_id}/generate_layout/:
    post:
      tags:
      - projects
      summary: Init layout generation job, save project if needed
      description: 'Если проект в статусе черновика, сохраняет проект. Запускает процесс
        генерации планировки, возвращает id планировки и сколько еще планировок можно
        сгенерировать в этом проекте. Принимает ключ идемпотентности: в ответ на повторный
        запрос с тем же самым сочетанием project_id + idempotency_key сервер вернёт
        layout_id, который был возвращён при первом запросе'
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      security:
      - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                room_description:
                  $ref: '#/components/schemas/RoomDescription'
                furniture_item_ids:
                  type: array
                  items:
                    type: string
                idempotency_key:
                  type: string
              required:
              - room_description
              - furniture_item_ids
              - idempotency_key
      responses:
        '201':
          description: Layout generation started successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  layout_id:
                    type: string
                  layout_requests_left:
                    type: integer
                required:
                - layout_id
                - layout_requests_left
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Project not found
        '500':
          description: 'Server error'
  /api/v1/projects{project_id}/layouts/:
    get:
      tags:
      - projects
      summary: Get all layouts for the project
      description: Возвращает все сгенерированные планировки в проекте
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      security:
      - tokenAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  layouts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Layout'
                required:
                - job_status
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Project not found
        '500':
          description: 'Server error'
  /api/v1/projects{project_id}/layouts/{layout_id}/:
    get:
      tags:
      - projects
      summary: Get layout by id
      description: Если планировка успешно сгенерирована, job_status = "COMPLETE",
        и эндпоинт возвращает планировку.
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: layout_id
        in: path
        required: true
        schema:
          type: string
      security:
      - tokenAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_status:
                    type: string
                    enum:
                    - PENDING
                    - IN_PROGRESS
                    - COMPLETE
                    - FAILED
                  layout:
                    $ref: '#/components/schemas/Layout'
                required:
                - job_status
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Project or layout not found
        '500':
          description: 'Server error'
  /api/v1/room_types/:
    get:
      operationId: rooms_type_list
      description: Получение списка типов комнат. Доступно всем пользователям.
      summary: Получение списка типов комнат
      tags:
      - room_types
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoomType'
          description: Данные типов комнат
        '401':
          description: Unauthorized
        '500':
          description: 'Server error'
components:
  schemas:
    Activation:
      type: object
      properties:
        uid:
          type: string
        token:
          type: string
      required:
      - token
      - uid
    CustomUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        city:
          type: string
          nullable: true
          title: Город
          maxLength: 50
        birthday:
          type: string
          format: date
          nullable: true
          title: Дата рождения
          description: Введите дату в прошлом. Будущие даты не допустимы.
        is_designer:
          type: boolean
          title: Дизайнер
        date_joined:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - date_joined
      - email
      - id
      - last_login
    Furniture:
      type: object
      description: Сериализатор для мебели.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Наименование мебели
          maxLength: 128
        name_eng:
          type: string
          title: Наименование мебели на английском языке
          maxLength: 128
        depth:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Глубина мебели
          description: Глубина в мм
        width:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Ширина мебели
          description: Ширина в мм
        depth_with_access_zone:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Глубина мебели c зоной подхода
          description: Глубина c зоной подхода в мм
        width_with_access_zone:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Ширина мебели c зоной подхода
          description: Ширина c зоной подхода в мм
        type_of_rooms:
          $ref: '#/components/schemas/RoomType'
        image:
          type: string
          format: uri
          nullable: true
          title: Изображение мебели
      required:
      - depth
      - depth_with_access_zone
      - id
      - name
      - name_eng
      - type_of_rooms
      - width
      - width_with_access_zone
    PasswordResetConfirm:
      type: object
      properties:
        uid:
          type: string
        token:
          type: string
        new_password:
          type: string
      required:
      - new_password
      - token
      - uid
    PatchedCustomUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        city:
          type: string
          nullable: true
          title: Город
          maxLength: 50
        birthday:
          type: string
          format: date
          nullable: true
          title: Дата рождения
          description: Введите дату в прошлом. Будущие даты не допустимы.
        is_designer:
          type: boolean
          title: Дизайнер
        date_joined:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
    RoomType:
      type: object
      properties:
        name:
          type: string
          title: Наименование комнаты
          maxLength: 128
          enum:
          - bedroom
        slug:
          type: string
          title: Слаг
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        id:
          type: string
      required:
      - name
      - slug
    SendEmailReset:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    SetPassword:
      type: object
      properties:
        new_password:
          type: string
        current_password:
          type: string
      required:
      - current_password
      - new_password
    SetUsername:
      type: object
      properties:
        current_password:
          type: string
        new_email:
          type: string
          format: email
          title: Email
          maxLength: 256
      required:
      - current_password
      - new_email
    Tariff:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        is_active:
          type: string
          readOnly: true
        start_day:
          type: string
          readOnly: true
        period:
          type: string
          readOnly: true
        next_day_of_payment:
          type: string
          readOnly: true
        project_limit:
          type: integer
          default: 0
        rooms_limit:
          type: integer
          default: 0
        name:
          type: string
          title: Наименование тарифа
          maxLength: 256
        name_english:
          type: string
          title: Наименование тарифа на английском языке
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
          title: Описание тарифа
        cost:
          type: integer
          maximum: 32767
          minimum: 0
          title: Стоимость
        is_default:
          type: boolean
          title: По умолчанию
      required:
      - cost
      - description
      - id
      - is_active
      - name
      - name_english
      - next_day_of_payment
      - period
      - start_day
    Token:
      type: object
      properties:
        auth_token:
          type: string
      required:
      - auth_token
    TokenCreate:
      type: object
      properties:
        password:
          type: string
        email:
          type: string
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
      required:
      - email
      - id
    UserCreatePasswordRetype:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 256
        id:
          type: string
          format: uuid
          readOnly: true
        password:
          type: string
          writeOnly: true
        re_password:
          type: string
      required:
      - email
      - id
      - password
      - re_password
    UsernameResetConfirm:
      type: object
      properties:
        new_email:
          type: string
          format: email
          title: Email
          maxLength: 256
      required:
      - new_email
    Project:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          maxLength: 64
        is_draft:
          type: boolean
        created_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - is_draft
      - created_at
    Wall:
      type: integer
      enum:
      - 0
      - 1
      - 2
      - 3
    Door:
      type: object
      properties:
        width:
          type: integer
        wall:
          $ref: '#/components/schemas/Wall'
        x_center:
          type: integer
        open_direction:
          type: string
          enum:
          - inside_left
          - inside_right
          - outside_left
          - outside_right
      required:
      - width
      - wall
      - open_direction
    Window:
      type: object
      properties:
        width:
          type: integer
        height:
          type: integer
        wall:
          $ref: '#/components/schemas/Wall'
        x_center:
          type: integer
      required:
      - width
      - wall
    Balcony:
      type: object
      properties:
        width:
          type: integer
        wall:
          $ref: '#/components/schemas/Wall'
        x_center:
          type: integer
      required:
      - width
      - wall
    RoomDescription:
      type: object
      properties:
        type_id:
          type: string
        length:
          type: integer
        width:
          type: integer
        doors:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Door'
        windows:
          type: array
          items:
            $ref: '#/components/schemas/Window'
        balconies:
          type: array
          items:
            $ref: '#/components/schemas/Balcony'
      required:
      - length
      - width
      - doors
      - windows
      - balconies
    FurniturePlacement:
      type: object
      properties:
        furniture_item_id:
          type: string
        x_center:
          type: integer
        y_center:
          type: integer
        rotation_degree:
          type: integer
          enum:
          - 0
          - 90
          - 180
          - 270
      required:
      - furniture_item_id
      - x_center
      - y_center
      - rotation_degree
    Layout:
      type: object
      properties:
        id:
          type: string
        furniture_placements:
          type: array
          items:
            $ref: '#/components/schemas/FurniturePlacement'
  securitySchemes:
    oauth2:
      type: oauth2
      flows: {}
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
