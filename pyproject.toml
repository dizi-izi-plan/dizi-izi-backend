[tool.ruff]
line-length = 120
target-version = "py312"
[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "DJ",
    "UP",
]
exclude = [
    "**/migrations/**",
    "**/layout_algorithm/**",
    "__init__.py",
]

[tool.ruff.lint.isort]
known-first-party = ["config"]
[tool.ruff.lint.per-file-ignores]
"admin.py" = ["F401"]